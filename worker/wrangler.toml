name = "ethos-studio-api"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Route: https://ethos-studio-api.<account>.workers.dev/api/generate-card
# After deploy, set apiUrl in ethos-config.js to match.

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_ID"

[vars]
ALLOWED_ORIGINS = "https://rvodde-cyber.github.io,http://127.0.0.1:5500,http://localhost:8787"
HOURLY_LIMIT = "10"
DAILY_LIMIT = "300"
MAX_SOURCE_LENGTH = "500"
ANTHROPIC_MODEL = "claude-sonnet-4-20250514"

# Secrets (set via `wrangler secret put` — never commit):
# ANTHROPIC_API_KEY
# ACCESS_CODE
